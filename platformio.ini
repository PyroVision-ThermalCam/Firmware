[platformio]
src_dir = main
default_envs = debug

[env]
# This project requires esp-idf >=5.5.3 to have access to SPI PSRAM mode
platform = https://github.com/platformio/platform-espressif32#bf8f9c1f6d42c06b328d691890461bdfdc3d4db0
framework = espidf

platform_packages =

extra_scripts =
    pre:scripts/clean.py
    pre:scripts/patch.py
    scripts/format.py

build_flags =
    # Can not be set via Kconfig and the display requires it
    -DLV_COLOR_16_SWAP=1

lib_deps =

board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles =
    LICENSE
    webserver/provision.html
    webserver/logo.png

debug_tool = esp-builtin
debug_port = ${sysenv.PIO_UPLOAD_PORT, /dev/ttyUSB0}

upload_speed = 921600
upload_port = ${sysenv.PIO_UPLOAD_PORT, /dev/ttyUSB0}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_port = ${sysenv.PIO_UPLOAD_PORT, /dev/ttyUSB0}

[env:debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -D DEBUG

lib_deps =
    ${env.lib_deps}

extra_scripts =
    ${env.extra_scripts}

[env:release]
build_type = release
build_flags =
    ${env.build_flags}
    -D NDEBUG

lib_deps =
    ${env.lib_deps}

extra_scripts =
    ${env.extra_scripts}
